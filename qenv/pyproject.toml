[project]
name = "qenv"
version = "0.1.0"
description = "qenv manages this dotfiles repository."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[dependency-groups]
test = [
  "pytest>=8.3.2",
  "pytest-bdd>=7.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false